name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  linux:
    runs-on: ubuntu-latest
    container: swift:6.0
    steps:
      - uses: actions/checkout@v4
      - run: apt-get update -qq && apt-get install -y -qq curl >/dev/null
      - run: scripts/fetch-soundfont
      - run: swift test
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: scripts/fetch-soundfont
      - run: swift test
  diff-fluidsynth:
    # Comparison against FluidSynth (some deviations are expected; see docs/SF2_COMPLIANCE.md). Fails when any
    # case's deviation exceeds the limits in scripts/diff-report.py (set just above the current measurement).
    runs-on: ubuntu-latest
    container: swift:6.0
    steps:
      - uses: actions/checkout@v4
      - run: apt-get update -qq && apt-get install -y -qq curl fluidsynth python3 >/dev/null
      - run: scripts/fetch-soundfont
      - run: scripts/diff-fluidsynth
      - if: always()
        run: cat diff-report.md >> "$GITHUB_STEP_SUMMARY" || true
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diff-report
          path: diff-report.md
  parity-gbk:
    # Cross-engine parity: gbk JS engine (pinned) vs this engine's sf2-parity-render (tolerance 1e-6 per sample), then
    # whole-song renders compared by scripts/compare-gbk/run.
    runs-on: ubuntu-latest
    container: swift:6.0
    steps:
      - uses: actions/checkout@v4
      - run: apt-get update -qq && apt-get install -y -qq curl git ca-certificates >/dev/null
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: swift build -c release --product sf2-parity-render
      - run: |
          git clone -q https://github.com/yishengjiang99/gbk.git ../gbk
          git -C ../gbk checkout -q 7cda7b3a8cf02aae58abb2848ac78b251b10d9c4
      - run: cd ../gbk && npm ci --ignore-scripts
      - run: cd ../gbk && SF2_PARITY_SWIFT_BIN=$GITHUB_WORKSPACE/.build/release/sf2-parity-render node --import tsx/esm --test test/sf2-cross-engine-parity.test.ts
      # Whole-song JS vs Swift renders (gbk default engine settings, effects + master bus on); fails unless near bit-exact.
      - run: apt-get install -y -qq python3 python3-numpy python3-scipy >/dev/null
      - run: COMPARE_GATE=1 scripts/compare-gbk/run ../gbk compare-gbk-out
      - if: always()
        run: cat compare-gbk-out/report.md >> "$GITHUB_STEP_SUMMARY" || true
