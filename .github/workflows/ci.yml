name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  linux:
    runs-on: ubuntu-latest
    container: swift:6.0
    steps:
      - uses: actions/checkout@v4
      - run: apt-get update -qq && apt-get install -y -qq curl >/dev/null
      - run: scripts/fetch-soundfont
      - run: swift test
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: scripts/fetch-soundfont
      - run: swift test
  diff-fluidsynth:
    # Informational comparison against FluidSynth (deviations are expected; see docs/SF2_COMPLIANCE.md).
    runs-on: ubuntu-latest
    container: swift:6.0
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - run: apt-get update -qq && apt-get install -y -qq curl fluidsynth python3 >/dev/null
      - run: scripts/fetch-soundfont
      - run: scripts/diff-fluidsynth && cat diff-report.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: diff-report
          path: diff-report.md
  parity-gbk:
    # Cross-engine parity: gbk JS engine (pinned) vs this engine's sf2-parity-render (tolerance 1e-6 per sample).
    runs-on: ubuntu-latest
    container: swift:6.0
    steps:
      - uses: actions/checkout@v4
      - run: apt-get update -qq && apt-get install -y -qq curl git ca-certificates >/dev/null
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: swift build -c release --product sf2-parity-render
      - run: |
          git clone -q https://github.com/yishengjiang99/gbk.git ../gbk
          git -C ../gbk checkout -q eee3c440335b9fa1772a02acb041871c357e44d8
      - run: cd ../gbk && npm ci --ignore-scripts
      - run: cd ../gbk && SF2_PARITY_SWIFT_BIN=$GITHUB_WORKSPACE/.build/release/sf2-parity-render node --import tsx/esm --test test/sf2-cross-engine-parity.test.ts
